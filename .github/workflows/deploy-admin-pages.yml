# Deploys admin-panel/ (HTML/CSS/JS) to GitHub Pages.
name: Deploy Admin Panel

on:
  push:
    branches: [main]
    paths:
      - "admin-panel/**"
      - ".github/workflows/deploy-admin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload admin-panel as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-panel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
