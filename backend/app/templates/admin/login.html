{% extends "admin/base.html" %}
{% block title %}Admin login{% endblock %}
{% block body %}
<section class="card" style="max-width:420px;margin:40px auto;">
  <h1>Admin login</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <label for="totp">2FA code (if enabled)</label>
    <input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code">
    <p style="margin-top:16px"><button type="submit">Sign in</button></p>
  </form>
</section>
{% endblock %}
