{% extends "admin/base.html" %}
{% block title %}Audit{% endblock %}
{% block body %}
<h1>Audit log</h1>
<div class="card">
<table>
  <thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Detail</th></tr></thead>
  <tbody>
  {% for l in logs %}
    <tr>
      <td>{{ l.created_at }}</td>
      <td>{{ l.admin_id }}</td>
      <td>{{ l.action }}</td>
      <td>{{ l.detail }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
